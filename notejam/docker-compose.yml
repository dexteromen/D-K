version: '3.8' #file format version

services:
  app:
    build: .
    container_name: notejam-app
    restart: always
    ports:
      - "5000:4000" 
    depends_on:
      - db
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: notejam
      DB_PORT: 5432
    volumes:
      - appdata:/app/uploads 
    networks:
      - notejam-network

  db:
    image: postgres:latest
    container_name: notejam-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: notejam
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data 
    networks:
      - notejam-network

networks:
  notejam-network:
    name: notejam-network
    driver: bridge
    
volumes:
  pgdata:
    name: notejam_pgdata 
  appdata:
    name: notejam_appdata
