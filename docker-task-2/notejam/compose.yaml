services:
  server:
    build:
      context: .
    environment:
      NODE_ENV: development
    ports:
      - 3000:3000 #local:container
    depends_on:
      - db
    networks:
      - express-postgres
    develop:
      watch:
        - action: sync
          path: .
          target: /usr/src/app # Target the mounted directory inside the container
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json
  db:
    image: postgres
    restart: always
    user: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=notejam
      - POSTGRES_PASSWORD=password
    networks:
      - express-postgres
    expose:
      - 5431 #to access on local machine localhost:5431 in postgres
    ports:
      - 5431:5432 #local:container
networks:
    express-postgres:
      name: notejam-app-express-postgres
      driver: bridge
volumes:
  db-data: